# File Guardian schema 2 is a deliberate break from the legacy implicit scan
# configuration. This example is evaluate-only and works without network
# access or an external analyzer.
schema_version = "2"

[authorization]
default_profile = "publication"

[authorization.workspace]
root = "/var/lib/file-guardian/runs"

[authorization.workspace.capture]
max_entries = 200000
max_files = 100000
max_file_bytes = 1073741824
max_total_bytes = 10737418240
max_depth = 64

[[authorization.profiles]]
id = "publication"
pipeline = "publication"
action_mode = "evaluate"
default_unbound_observation = "error"

[[pipelines]]
id = "publication"

[[pipelines.stages]]
id = "built-in-policy"
execution = "serial"
max_concurrency = 1
analyzers = ["publication-rules"]
prior_observations = "none"

[[analyzers]]
id = "publication-rules"
kind = "builtin_rules"
required = true
rule_files = ["/etc/file-guardian/rules.d/publication.toml"]
max_content_bytes = 16777216

[analyzers.content_applicability]
invalid_utf8 = "fail"
over_max_bytes = "fail"

[analyzers.selection]
include = ["**"]
exclude = []
artifact_kinds = ["physical_file"]

[[policy_bindings]]
id = "publication-rules-deny"
profile = "publication"
analyzer = "publication-rules"
rule = "*"
directive = "deny"

[[daemon.jobs]]
id = "uploads"
enabled = false
kind = "policy_scan"
profile = "publication"
every_secs = 300
run_on_start = true

[daemon.jobs.target]
kind = "literal"
path = "/srv/uploads"

[logging]
level = "info"
directory = "/var/log/file-guardian"
max_bytes = 104857600
max_files = 5
console = false
