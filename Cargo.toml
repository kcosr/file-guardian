[package]
name = "file-guardian"
version = "0.0.4"
edition = "2021"
license = "MIT"
authors = ["kevin <kevin@example.com>"]
description = "Fail-closed authorization of staged file trees using configurable policy analyzers."

[[bin]]
name = "file-guardian"
path = "src/bin/file-guardian.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "signal", "process", "io-util"] }
glob = "0.3"
globset = "0.4"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
rustix = { version = "1.0", features = ["fs", "process"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
