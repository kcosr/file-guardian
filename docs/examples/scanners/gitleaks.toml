title = "File Guardian Gitleaks policy"

# Extend the rules compiled into the discovered, version-checked Gitleaks
# executable. This file is administrator-owned and mounted read-only; a staged
# repository's .gitleaks.toml is never allowed to replace authorization policy.
[extend]
useDefault = true

