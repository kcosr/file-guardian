schema_version = "2"

# This is a schema-complete forward configuration example. The strict parser
# accepts and validates every field below. The external-tool analyzers remain
# fail-closed placeholders until the deterministic delegate phase lands.

[authorization]
default_profile = "publication"

[authorization.workspace]
root = "/var/lib/file-guardian/runs"

[authorization.workspace.capture]
max_entries = 200000
max_files = 100000
max_file_bytes = 1073741824
max_total_bytes = 10737418240
max_depth = 64

[[authorization.profiles]]
id = "publication"
pipeline = "publication-review"
action_mode = "evaluate"
default_unbound_observation = "deny"

[[pipelines]]
id = "publication-review"

[[pipelines.stages]]
id = "builtin-policy"
execution = "parallel"
max_concurrency = 2
analyzers = ["publication-rules"]
prior_observations = "none"

[pipelines.stages.prior_limits]
max_observations = 10000
max_serialized_bytes = 1048576

[[pipelines.stages]]
id = "deterministic-security"
execution = "parallel"
max_concurrency = 2
analyzers = ["password-scanner", "secret-scanner"]
prior_observations = "none"

[pipelines.stages.prior_limits]
max_observations = 10000
max_serialized_bytes = 1048576

[[pipelines.stages]]
id = "semantic-review"
execution = "serial"
analyzers = ["publication-llm"]
prior_observations = "findings_summary"

[pipelines.stages.prior_limits]
max_observations = 10000
max_serialized_bytes = 1048576

[[analyzers]]
id = "publication-rules"
kind = "builtin_rules"
required = true
rule_files = ["/etc/file-guardian/rules.d/publication.toml"]
max_content_bytes = 16777216

[analyzers.content_applicability]
required_text_include = ["**/*.md", "**/*.rs", "**/*.toml"]

[[analyzers]]
id = "password-scanner"
kind = "external_tool"
required = true
adapter = "/usr/libexec/file-guardian/fg-password-scanner"
args = []
protocol = "file-guardian-delegate/1"
sandbox = "required"

[analyzers.selection]
include = ["**"]
exclude = ["**/vendor/**"]
artifact_kinds = ["physical_file"]

[analyzers.limits]
wall_timeout_secs = 60
memory_bytes = 536870912
max_output_bytes = 10485760
max_findings = 10000

[[analyzers]]
id = "secret-scanner"
kind = "external_tool"
required = true
adapter = "/usr/libexec/file-guardian/fg-secret-scanner"
args = []
protocol = "file-guardian-delegate/1"
sandbox = "required"

[analyzers.selection]
include = ["**"]
exclude = []
artifact_kinds = ["physical_file"]

[analyzers.limits]
wall_timeout_secs = 90
memory_bytes = 536870912
max_output_bytes = 10485760
max_findings = 10000

[[analyzers]]
id = "publication-llm"
kind = "pi_classifier"
required = true
scope = "tree"

[analyzers.pi]
platform = "linux"
sandbox = "tool-sidecar-bubblewrap-v1"
# Pi is a normal host process for model transport. Its persistent Bubblewrap
# tool sidecar is networkless.
network = "pi_host_sidecar_none"
runtime_root = "/opt/file-guardian/pi-runtime"
runtime_manifest = "runtime-manifest.json"
launcher = "bin/node"
pi_entrypoint = "lib/pi/dist/cli.js"
bubblewrap_executable = "/usr/bin/bwrap"
expected_bubblewrap_version = "0.11.1"
expected_pi_version = "0.83.0"
provider = "internal-provider"
model = "internal-classification-model"
thinking = "high"
instruction_file = "/etc/file-guardian/prompts/publication-review.md"
trusted_extension = "/usr/libexec/file-guardian/pi-classifier-extension.js"
tool_sidecar_runner = "/usr/libexec/file-guardian/pi-tool-sidecar-runner.js"
isolated_agent_dir = "/etc/file-guardian/pi-agent"
output_schema = "file-guardian-pi-classifier/1"
tool_grant = "sandboxed-shell-v1"

[[analyzers.pi.credentials]]
label = "internal-model-primary"
source_env = "FILE_GUARDIAN_PI_CREDENTIAL_PRIMARY"
target_env = "INTERNAL_PROVIDER_API_KEY"

[analyzers.vocabulary]
classifications = ["public", "internal", "restricted", "uncertain"]
confidences = ["low", "medium", "high"]
reason_codes = [
  "internal_project_material",
  "restricted_source_material",
  "customer_confidential_material",
  "publication_context_unclear",
]

[analyzers.selection]
include = ["**"]
exclude = ["**/vendor/**"]
artifact_kinds = ["physical_file"]

[analyzers.content_applicability]
required_text_include = ["**/*.md", "**/*.rs", "**/*.toml"]

[analyzers.limits]
startup_timeout_secs = 20
idle_timeout_secs = 30
wall_timeout_secs = 180
termination_grace_secs = 5
memory_bytes = 1073741824
cpu_time_secs = 120
max_open_files = 64
max_processes = 4096
max_stdout_bytes = 1048576
max_stderr_bytes = 1048576
max_output_bytes = 2097152
max_findings = 1000
max_tool_calls = 1000
max_bytes_read = 268435456
max_read_bytes_per_call = 1048576
max_search_bytes_per_call = 67108864
max_search_calls = 100
max_search_results = 1000
max_view_files = 100000
max_view_entries = 200000
max_view_bytes = 268435456
max_view_depth = 64

[[policy_bindings]]
id = "builtin-deny"
profile = "publication"
analyzer = "publication-rules"
rule = "*"
directive = "deny"

[[policy_bindings]]
id = "password-deny"
profile = "publication"
analyzer = "password-scanner"
rule = "*"
directive = "deny"

[[policy_bindings]]
id = "secret-deny"
profile = "publication"
analyzer = "secret-scanner"
rule = "*"
directive = "deny"

[[policy_bindings]]
id = "llm-public-audit"
profile = "publication"
analyzer = "publication-llm"
classification = "public"
directive = "audit"

[[policy_bindings]]
id = "llm-internal-audit"
profile = "publication"
analyzer = "publication-llm"
classification = "internal"
directive = "audit"

[[policy_bindings]]
id = "llm-restricted-audit"
profile = "publication"
analyzer = "publication-llm"
classification = "restricted"
directive = "audit"

[[policy_bindings]]
id = "llm-uncertain-audit"
profile = "publication"
analyzer = "publication-llm"
classification = "uncertain"
directive = "audit"

[logging]
level = "info"
directory = "/var/log/file-guardian"
console = false
